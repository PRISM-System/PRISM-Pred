services:
  prism-pred:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-pred
    ports:
      - "8003:8003"  # Prediction API server (호스트 8003 → 컨테이너 8003)
    volumes:
      - ./main.py:/app/main.py
      - ./utils.py:/app/utils.py
      - ./module.py:/app/module.py
      - ./llm_io.py:/app/llm_io.py
      - ./run.py:/app/run.py
      - ./demo_prediction.sh:/app/demo_prediction.sh
      - ./prism_prediction:/app/prism_prediction
      - ./outputs:/app/outputs
      - ./static:/app/static
      - ./templates:/app/templates
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - prism-shared-network

networks:
  prism-shared-network:
    external: true
